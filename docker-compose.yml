# ==============================================================================
# DocsObs — Docker Compose (Full-Stack: PostgreSQL + Backend + Frontend)
# ==============================================================================
# Início rápido: docker compose up -d --build
# Parada: docker compose down
# Reset completo: docker compose down -v && docker compose up -d --build

services:
  # ---------- Banco de Dados PostgreSQL 16 ----------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-docsobs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-docsobs}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - docsobs-network

  # ---------- Backend API (Express + Prisma) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-docsobs}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (min. 32 caracteres) no .env}
      JWT_EXPIRES_IN: "7d"
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_BYTES: "10485760"
      # Seed desabilitado por padrão (DOC-32). Com RUN_SEED=true em produção,
      # ADMIN_SEED_PASSWORD e OPERATIONAL_SEED_PASSWORD (mín. 12 caracteres) são
      # obrigatórias; sem elas o seed falha e o container não sobe.
      RUN_SEED: ${RUN_SEED:-false}
      # Sem valor: repassadas do shell/.env apenas quando definidas.
      ADMIN_SEED_PASSWORD:
      OPERATIONAL_SEED_PASSWORD:
      DEMO_SEED_PASSWORD:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USER:
      SMTP_PASS:
      SMTP_SECURE:
      EMAIL_FROM:
      CRON_ENABLED:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_ENCRYPTION_KEY: ${GOOGLE_TOKEN_ENCRYPTION_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      EXTRACTION_SERVICE_URL: ${EXTRACTION_SERVICE_URL:-}
      EXTRACTION_TIMEOUT_MS: ${EXTRACTION_TIMEOUT_MS:-60000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - docsobs-network

  # ---------- Serviço de Extração (OCR, perfil opcional) ----------
  extraction:
    profiles: ["extraction"]
    build:
      context: ./extraction-service
    image: docsobs-extraction:latest
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - docsobs-network

  # ---------- Frontend SPA (Nginx + Vite Build) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - docsobs-network

# ---------- Volumes Nomeados Persistentes ----------
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

# ---------- Rede Isolada ----------
networks:
  docsobs-network:
    driver: bridge
